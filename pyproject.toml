[project]
name = "ronaldohotel"
version = "0.1.0"
description = "Hotel booking cancellation prediction. Supervised learning algorithms implemented from scratch and compared against scikit-learn."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "IF3170 G29 MiMHotels" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.uv]
required-version = ">=0.13.7"

# ---------------------------------------------------------------- Ruff
[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "W",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "NPY",  # NumPy-specific rules (legacy random API, deprecated aliases)
    "PD",   # pandas-vet
    "PERF", # perflint
    "RUF",  # ruff-specific
    "A",    # flake8-builtins
    "ICN",  # import conventions (np, pd, plt)
    "TID",  # flake8-tidy-imports (enforces the "from scratch" import ban)
    "ERA",  # no commented-out code
    "T20",  # no print() in library code
    "PLC",
    "PLE",
    "PLW",  # pylint (convention, error, warning only)
]
ignore = [
    "N803", # argument name should be lowercase: ML convention is X
    "N806", # variable in function should be lowercase: X_train, etc.
]

[tool.ruff.lint.isort]
known-first-party = ["ronaldohotel"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sklearn".msg = "From-scratch code may only use NumPy-level math. Put sklearn code in ronaldohotel.baselines."
"scipy".msg = "From-scratch code may only use NumPy-level math (confirm scipy with the assistants via Teams QnA)."
"pandas".msg = "From-scratch algorithms operate on NumPy arrays only. Put pandas code in ronaldohotel.data."

[tool.ruff.lint.per-file-ignores]
"src/ronaldohotel/{baselines,data,evaluation,plotting}/**" = ["TID251"]
"src/{run_baseline,make_submission}.py" = ["TID251"]
"tests/**" = ["T20", "TID251"]
"*.ipynb" = ["T20", "TID251", "E402", "E501", "B018", "ERA001"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
pretty = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "pandas.*",
    "sklearn",
    "sklearn.*",
    "scipy",
    "scipy.*",
    "matplotlib",
    "matplotlib.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
filterwarnings = ["error"]
xfail_strict = true

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["ronaldohotel"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
